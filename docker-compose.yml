# Dos servicios: web (Vite+) y api (Hono/Bun). No hay contenedor de base de datos.
# libSQL es un fichero en ./data, montado en /data (fuera de /app para no
# romper SQLite con el bind-mount del código + bun --hot).
name: agentic-kanban

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      # En el Mac, si 3000 está ocupado: API_HOST_PORT=3002
      - "${API_HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/data/agentic-kanban.db
      API_PORT: "3000"
      # Better Auth: secreto de dev (cámbialo en prod). La URL apunta a Vite+
      # porque el navegador habla con el frontend y el proxy reenvía /api.
      BETTER_AUTH_SECRET: local-dev-only-change-in-session-1
      BETTER_AUTH_URL: http://localhost:5173
    volumes:
      - .:/app
      - /app/node_modules # anónimo: el node_modules de Linux no lo pisa el Mac
      - ./data:/data # .db + outbox.jsonl (host TablePlus); outbox no se commitea
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/api/health'); const b = await r.json(); if (b.api !== 'ok' || b.database !== 'ok') process.exit(1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      # El proxy de Vite+ habla con el servicio api por la red de Compose.
      API_PROXY_TARGET: http://api:3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:5173'); if (!r.ok) process.exit(1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
